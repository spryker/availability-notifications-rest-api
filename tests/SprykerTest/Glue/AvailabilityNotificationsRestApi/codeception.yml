namespace: SprykerTest\Glue\AvailabilityNotificationsRestApi
paths:
    tests: .
    data: ../../../_data
    support: _support
    output: ../../../_output
coverage:
    enabled: true
    remote: false
    whitelist:
        include:
            - '../../../../src/*'

suites:
    Glue:
        path: .
        actor: AvailabilityNotificationsRestApiTester
        modules:
            enabled:
                - Asserts
                - \SprykerTest\Shared\Testify\Helper\Environment
                - \SprykerTest\Shared\Testify\Helper\ConfigHelper
                - \SprykerTest\Shared\Testify\Helper\LocatorHelper
                - \SprykerTest\Glue\Testify\Helper\DependencyProviderHelper
                - \SprykerTest\Glue\Testify\Helper\FactoryHelper
